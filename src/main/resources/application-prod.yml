# 生产环境配置：所有敏感信息必须通过环境变量传入，禁止在此文件写死密钥

# Render 注入 PORT；也可用 SERVER_PORT（Docker 等）
server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  main:
    banner-mode: off
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  ai:
    dashscope:
      # 必须设置环境变量 DASHSCOPE_API_KEY
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: ${DASHSCOPE_MODEL:qwen-plus}
          temperature: ${DASHSCOPE_TEMPERATURE:0.8}
          max-tokens: ${DASHSCOPE_MAX_TOKENS:2048}
      embedding:
        options:
          model: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v4}
    mcp:
      client:
        enabled: ${MCP_ENABLED:false}
        request-timeout: 180s
        type: SYNC
        stdio:
          connections:
            amap:
              command: npx
              args: ["-y", "@amap/amap-maps-mcp-server"]
              env:
                AMAP_MAPS_API_KEY: ${AMAP_MCP_KEY}
                LANG: C.UTF-8
                LC_ALL: C.UTF-8
            web-search:
              command: npx
              args: ["-y", "@zhafron/mcp-web-search"]
              env:
                DEFAULT_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:duckduckgo}
                LANG: C.UTF-8
                LC_ALL: C.UTF-8
            pdf:
              command: npx
              args: ["-y", "@mcp-z/mcp-pdf"]
              env:
                LANG: C.UTF-8
                LC_ALL: C.UTF-8
            file-manager:
              command: npx
              args: ["-y", "@mcpcn/mcp-file-manager"]
              env:
                LANG: C.UTF-8
                LC_ALL: C.UTF-8

# 高德 MCP Key，仅在 MCP_ENABLED=true 时需配置
amap:
  mcp:
    key: ${AMAP_MCP_KEY:}

# 计算机学生职规大师智能体
app:
  career-master:
    stream-enabled: true
  console:
    enabled: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # JWT：生产必须显式提供 JWT_SECRET（无默认值，缺失则启动失败，杜绝弱密钥）
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  # RAG 向量库（PostgreSQL + pgvector）：与 dev 一致，密码等走环境变量
  vector-datasource:
    url: ${VECTOR_DB_URL:jdbc:postgresql://localhost:5432/vectordb}
    username: ${VECTOR_DB_USERNAME:postgres}
    password: ${VECTOR_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  memory:
    # 与 dev 保持一致：聊天历史落 MySQL（跨设备同步），而非旧的 file 存储
    type: db
    max-messages-per-conversation: ${MEMORY_MAX_MESSAGES:50}
    history-token-budget: ${HISTORY_TOKEN_BUDGET:4000}
    enable-summary: ${ENABLE_SUMMARY:true}
    summary-max-chars: ${SUMMARY_MAX_CHARS:800}
    summary-cache-max-size: ${SUMMARY_CACHE_MAX_SIZE:500}
    summary-cache-ttl-minutes: ${SUMMARY_CACHE_TTL_MINUTES:360}
  rag:
    chunk-size: ${RAG_CHUNK_SIZE:250}
    min-chunk-size-chars: 60
    keep-separator: false
    # 混合检索（向量 + BM25 → RRF → rerank 精排），与 dev 对齐
    hybrid:
      rrf-top-n: 10
      rrf-k: 60
      rerank-enabled: true
      rerank-top-n: 10
    hyde:
      enabled: true
      length-threshold: 40
  file-save:
    base-dir: ${FILE_SAVE_DIR:./data/files}
  react-stream:
    tools-enabled: ${REACT_TOOLS_ENABLED:true}
    mcp-enabled: ${MCP_ENABLED:false}
    typing-delay-ms: 40
    step-timeout-ms: ${REACT_STEP_TIMEOUT_MS:120000}

logging:
  level:
    root: INFO
    com.example.aimaster: INFO
