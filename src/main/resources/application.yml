# 本地默认 8080；Render 等平台会注入 PORT，必须读环境变量
server:
  port: ${PORT:8080}

spring:
  profiles:
    active: dev
  application:
    name: ai-career-master
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ai_love_master?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 邮件发送（注册验证码）：QQ 邮箱 SMTP，密码处填「授权码」而非登录密码
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          ssl:
            enable: true
        debug: false
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-dashscope-api-key}
      chat:
        options:
          model: qwen-plus
          temperature: 0.8
          max-tokens: 2048

# MyBatis-Plus（登录/注册用）
mybatis-plus:
  type-aliases-package: com.example.aimaster.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# 计算机学生职规大师 + 认证配置
app:
  # 管理员账号：启动时将该用户名提升为 ADMIN（可改环境变量 APP_ADMIN_USERNAME）
  admin:
    username: ${APP_ADMIN_USERNAME:demo}
  # RAG 向量库数据源（PostgreSQL + pgvector，仅向量存取，密码在 dev/prod 配置或环境变量中填写）
  vector-datasource:
    url: ${VECTOR_DB_URL:jdbc:postgresql://localhost:5432/vectordb}
    username: ${VECTOR_DB_USERNAME:postgres}
    password: ${VECTOR_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jwt:
    secret: ${JWT_SECRET:ai-love-master-dev-secret-change-in-production}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    # 含 Netlify（https://*.netlify.app 匹配任意子域名预览/部署）；生产可用 CORS_ALLOWED_ORIGINS 覆盖
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5175,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5175,http://127.0.0.1:3000,https://*.netlify.app}
  # 职规大师智能体（可选覆盖）
  career-master:
    # 是否启用流式响应
    stream-enabled: true
  # 控制台交互：启用后可在运行应用的终端里输入问题，AI 在终端回复
  console:
    enabled: false
  # 多轮对话记忆（MySQL 落库，跨设备可回看；file 为旧文件存储兼容）
  memory:
    type: db
    # 单次取回用于 LLM 上下文裁度的最近消息条数上限（含压缩素材，全量仍落库）
    max-messages-per-conversation: 50
    # token 预算：纳入 LLM 上下文的历史消息总 token 上限（超出的早期消息被压缩/丢弃）
    history-token-budget: 4000
    # 早期对话 LLM 摘要压缩：true=超预算时生成摘要占位（按会话缓存复用），false=直接丢弃
    enable-summary: true
    # 摘要最大字符数（控制摘要本身占用的 token）
    summary-max-chars: 800
    # 会话摘要缓存（Caffeine）：容量上限按预估最大在线会话数，空闲过期防旧会话堆积
    summary-cache-max-size: 500
    summary-cache-ttl-minutes: 360
    file:
      base-dir: ./data/chat-memory
  # RAG 文档切割（优化后：250 token/块减少发散，60 字下限防过碎）
  rag:
    chunk-size: 250
    min-chunk-size-chars: 60
    keep-separator: false
    # 混合检索（生产链路）：向量 + BM25 → RRF → qwen3-rerank 精排
    hybrid:
      rrf-top-n: 10        # 两路各召回条数
      rrf-k: 60             # RRF 常数
      rerank-enabled: true  # 是否启用 qwen3-rerank 精排
      rerank-top-n: 10      # 送入精排的候选条数
    # HyDE 分流：复杂问题先 LLM 生成假设性回答再检索，简单问题直接标准 RAG（省成本）
    hyde:
      enabled: true          # 是否启用 HyDE 分流（评估后可按数据决定开/关）
      length-threshold: 40   # 长度阈值（字），query 超过视为复杂
  # 文件保存工具：职业规划、技能清单等保存目录
  file-save:
    base-dir: ${FILE_SAVE_DIR:./data/files}
  # 阿里云 OSS：头像图片存储（真实 AccessKey 填 application-dev.yml 或环境变量 OSS_*，不入库）
  oss:
    endpoint: ${OSS_ENDPOINT:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket: ${OSS_BUCKET:}
  # 超级智能体 ReAct 流式
  react-stream:
    tools-enabled: true
    mcp-enabled: true
    typing-delay-ms: 40
    step-timeout-ms: 120000   # 单步 120 秒，避免 DashScope 慢响应时超时
  # 敏感词过滤（输入/输出合规）
  sensitive-word:
    enabled: true
    words-file: classpath:sensitive-words.txt
    replacement: "***"
  # 语义缓存：相同独立问题直接命中缓存答案，跳过 RAG+LLM（仅新会话首轮生效，防多轮上下文错配）
  semantic-cache:
    capacity: 200        # 缓存容量上限（超出淘汰最旧）
    ttl-seconds: 1800    # 有效期 30 分钟，命中滑动刷新

# Resilience4j 限流：每分钟 20 次，超限立即拒绝
resilience4j:
  ratelimiter:
    instances:
      chatLimiter:
        limitForPeriod: ${RATE_LIMIT_PER_MINUTE:20}
        limitRefreshPeriod: 60s
        timeoutDuration: 0   # 不等待，超限直接 429
      # 错误上报接口限流（公开接口防刷）：每分钟 60 次
      monitorLimiter:
        limitForPeriod: 60
        limitRefreshPeriod: 60s
        timeoutDuration: 0
